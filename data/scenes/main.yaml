skybox:
  faces:
    - "data/skybox/px.png"
    - "data/skybox/nx.png"
    - "data/skybox/py.png"
    - "data/skybox/ny.png"
    - "data/skybox/pz.png"
    - "data/skybox/nz.png"
root:
  name: "MainScene"
  origin: [0, 0, 0]
  rotation: [0, 0, 0]
  scale: [1, 1, 1]
  components:
    - type: "Light"
      kind: "directional"
      direction: [0.4, -0.3, 0.8]
      ambient: [0.3, 0.3, 0.3]
      diffuse: [1.0, 0.95, 0.85]
      specular: [1.0, 1.0, 1.0]
    - type: "LightController"
      index: 0
  children:
    - name: "Ground"
      origin: [0, 0, 0]
      components:
        - type: "Mesh"
          shape: "box"
          width: 120.0
          height: 0.5
          depth: 100.0
          materials: ["asphalt"]
        - type: "RigidBody"
          mass: 0.0
    - name: "House"
      scale: [1.5, 1.5, 1.5]
      origin: [30, 0, 0]
      rotation: [0, -90, 0]
      components:
        - type: "Mesh"
          shape: "model" 
          path: "data/models/house/house.obj"
          materials:
            base: "matte"
            windows: "glass"
            yellow_house_dark: "matte"
            yellow_house_light: "matte"
      children:
        - name: "HouseCollider"
          components:
            - type: "Mesh"
              shape: "box"
              width: 8
              height: 12
              depth: 5
            - type: "RigidBody"
              mass: 0.0
    - name: "Hotel"
      scale: [1.5, 1.5, 1.5]
      origin: [30, 0, -15]
      rotation: [0, -90, 0]
      components:
        - type: "Mesh"
          shape: "model" 
          path: "data/models/hotel/hotel.obj"
          materials:
            base: "matte"
            hotel_dark: "matte"
            hotel_light: "matte"
            posters: "matte"
            windows: "glass"
      children:
        - name: "HotelCollider"
          components:
            - type: "Mesh"
              shape: "box"
              width: 6
              height: 20
              depth: 5
            - type: "RigidBody"
              mass: 0.0
    - name: "Gas"
      scale: [1.5, 1.5, 1.5]
      origin: [0, 0, 0]
      rotation: [0, 0, 0]
      components:
        - type: "Mesh"
          shape: "model" 
          path: "data/models/gas/gas.obj"
          materials:
            base: "matte"
            black: "rubber"
            g_light_on: "metal"
            gas_dark: "matte"
            gas_light: "matte"
            gas_neon: "metal"
            gray_street: "concrete"
            orange.001: "matte"
            r_light_off: "metal"
            windows: "glass"
      children:
        - name: "GasCollider1"
          origin: [4.5, 0, 0.75]
          components:
            - type: "Mesh"
              shape: "box"
              width: 5
              height: 5
              depth: 3.25
            - type: "RigidBody"
              mass: 0.0
        - name: "GasCollider2"
          origin: [-3.75, 0, -0.5]
          components:
            - type: "Mesh"
              shape: "box"
              width: 5.65
              height: 5
              depth: 0.5
            - type: "RigidBody"
              mass: 0.0

    - name: "Wall1"
      origin: [0, 0, -50]
      components:
        - type: "Mesh"
          shape: "box"
          width: 120.0
          height: 2
          depth: 1
          materials: ["concrete"]
        - type: "RigidBody"
          mass: 0.0
    - name: "Wall2"
      origin: [0, 0, 50]
      components:
        - type: "Mesh"
          shape: "box"
          width: 120.0
          height: 2
          depth: 1
          materials: ["concrete"]
        - type: "RigidBody"
          mass: 0.0
    - name: "Wall3"
      origin: [60, 0, 0]
      components:
        - type: "Mesh"
          shape: "box"
          width: 1
          height: 2
          depth: 100.0
          materials: ["concrete"]
        - type: "RigidBody"
          mass: 0.0
    - name: "Wall4"
      origin: [-60, 0, 0]
      components:
        - type: "Mesh"
          shape: "box"
          width: 1
          height: 2
          depth: 100.0
          materials: ["concrete"]
        - type: "RigidBody"
          mass: 0.0
    - name: "RoadVisuals"
      rotation: [0, 0, 0]
      scale: [5, 1, 5]
      origin: [0, 0.25, -1.35]
      components:
        - type: "Mesh"
          shape: "model" 
          path: "data/models/road/road.obj"
          materials:
            Material.001: "asphalt"
    - name: "Car"
      origin: [0, 2, 0]
      components:
        - type: "Mesh"
          shape: "box"
          width: 1.5
          height: 0.5
          depth: 4.5
        - type: "Vehicle"
          mass: 1600.0
          wheels:
            - node: "WheelFrontLeft"
              connectionPoint: [-0.8, 0.0, 1.2]
              suspensionRestLength: 0.6
              radius: 0.3
              isFrontWheel: true
            - node: "WheelFrontRight"
              connectionPoint: [0.8, 0.0, 1.2]
              suspensionRestLength: 0.6
              radius: 0.3
              isFrontWheel: true
            - node: "WheelBackLeft"
              connectionPoint: [-0.8, 0.0, -1.3]
              suspensionRestLength: 0.6
              radius: 0.3
              isFrontWheel: false
            - node: "WheelBackRight"
              connectionPoint: [0.8, 0.0, -1.3]
              suspensionRestLength: 0.6
              radius: 0.3
              isFrontWheel: false
        - type: "CarController"
          force: 1200.0
          angle: 25.0
          sensitivity: 2.0
          brake: 120.0
        - type: "CameraCycle"
        - type: "SteeringAnimation"
          steeringNodeName: "SteeringVisuals"
      children:
        - name: "OuterCameraAnchor"
          origin: [0, 1.5, -6]
          rotation: [0, 180, 0]
          components:
            - type: "Camera"
            - type: "OrbitalCameraController"
              orbitRadius: 7
              sensitivity: 75
        - name: "InnerCameraAnchor"
          origin: [0.5, 0.6, 1]
          rotation: [0, 180, 0]
          components:
            - type: "Camera"
              fov: 75
              smoothTime: 0.0
            - type: "CameraController"
              sensitivity: 75
        - name: "CarVisuals"
          rotation: [0, -90, 0]
          scale: [0.5, 0.5, 0.5]
          origin: [0, -1.25, -1.35]
          components:
            - type: "Mesh"
              shape: "model" 
              path: "data/models/van/van.obj"
              materials:
                Paint_main: "metal"
                glass: "glass"
                lambert1: "matte"
                lamp: "metal"
                metal: "brushed_metal"
                number_plate: "matte"
                rubber: "rubber"
        - name: "steeringAnchor"
          rotation: [0, -90, 0]
          scale: [0.5, 0.5, 0.5]
          origin: [0.51, 0.35, 1.5]
          children:
            - name: "SteeringVisuals"
              rotation: [0, 0, 50]
              components:
                - type: "Mesh"
                  shape: "model" 
                  path: "data/models/steering/steering.obj"
                  materials:
                    lambert1: "rubber"
        - name: "RosaryVisuals"
          scale: [0.05, 0.05, 0.05]
          rotation: [0, -90, 0]
          origin: [0, 0.75, 1.2]
          components:
            - type: "Mesh"
              shape: "model" 
              path: "data/models/rosary/rosary.obj"
              materials:
                Material_20: "metal"
                Material_21: "wood"
                Material_22: "brass"
        - name: "OuijaVisuals"
          scale: [0.15, 0.15, 0.15]
          rotation: [0, 180, 0]
          origin: [0, 0.05, 1.6]
          components:
            - type: "Mesh"
              shape: "model" 
              path: "data/models/ouija/ouija.obj"
              materials:
                Board: "wood"
                Material.001: "wood"
                Material.002: "wood"
                Material.003: "brass"
                Material.004: "rubber"
        - name: "PolaroidVisuals"
          scale: [0.05, 0.05, 0.05]
          rotation: [0, 135, 0]
          origin: [-0.5, 0.35, 1.85]
          components:
            - type: "Mesh"
              shape: "model" 
              path: "data/models/polaroid/polaroid.obj"
              materials:
                Material.005: "matte"
                Material.006: "matte"
                Material.007: "matte"
                Material.008: "brushed_metal"
                Material.009: "matte"
        - name: "PortalVisuals"
          scale: [0.6, 0.6, 0.6]
          rotation: [90, 0, 0]
          origin: [0, -0.35, -0.35]
          components:
            - type: "Mesh"
              shape: "model" 
              path: "data/models/portal/portal.obj"
              materials:
                039BE5: "magic"
                00BCD4: "magic"
                FFFFFF: "magic"
          children:
            - name: "PortalLight" 
              origin: [0, 0.1, 0]
              components:
                - type: "Light"
                  kind: "point"
                  diffuse: [0.1, 0.1, 0.8]
                  specular: [0.1, 0.1, 0.8]
                  fadeDistance: 5
                - type: "LightController"
                  index: 4
        - name: "HeadlightLeft"
          origin: [-0.6, 0.125, 2.1]
          components:
            - type: "Light"
              kind: "spot"
              direction: [0, -0.2, 1]
              cutoff: 25
              outerCutoff: 35
              diffuse: [1, 1, 0.9]
              specular: [1, 1, 1]
              fadeDistance: 65
            - type: "LightController"
              index: 1
        - name: "HeadlightRight"
          origin: [0.6, 0.125, 2.1]
          components:
            - type: "Light"
              kind: "spot"
              direction: [0, -0.2, 1]
              cutoff: 25
              outerCutoff: 35
              diffuse: [1, 1, 0.9]
              specular: [1, 1, 1]
              fadeDistance: 65
            - type: "LightController"
              index: 2
        - name: "CarInternalLight"
          origin: [0, 0.8, 1.2]
          components:
            - type: "Light"
              kind: "point"
              diffuse: [0.95, 0.85, 0.25]
              specular: [0.95, 0.85, 0.25]
              fadeDistance: 5
            - type: "LightController"
              index: 3
    - name: "WheelFrontLeft"
      rotation: [0, -90, 0]
      scale: [0.5, 0.5, 0.5]
      components:
        - type: "Mesh"
          shape: "model" 
          path: "data/models/wheel/wheel.obj"
          materials:
            metal: "brushed_metal"
            rubber: "rubber"
    - name: "WheelFrontRight"
      rotation: [0, 90, 0]
      scale: [0.5, 0.5, 0.5]
      components:
        - type: "Mesh"
          shape: "model" 
          path: "data/models/wheel/wheel.obj"
          materials:
            metal: "brushed_metal"
            rubber: "rubber"
    - name: "WheelBackLeft"
      rotation: [0, -90, 0]
      scale: [0.5, 0.5, 0.5]
      components:
        - type: "Mesh"
          shape: "model" 
          path: "data/models/wheel/wheel.obj"
          materials:
            metal: "brushed_metal"
            rubber: "rubber"
    - name: "WheelBackRight"
      rotation: [0, 90, 0]
      scale: [0.5, 0.5, 0.5]
      components:
        - type: "Mesh"
          shape: "model" 
          path: "data/models/wheel/wheel.obj"
          materials:
            metal: "brushed_metal"
            rubber: "rubber"
